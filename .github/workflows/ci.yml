name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd todo-list
          pip install -r requirements.txt flake8 pytest

      - name: Check Python syntax
        run: |
          cd todo-list
          python -m py_compile app.py test_app.py

      - name: Run linter (flake8)
        run: |
          cd todo-list
          flake8 --max-line-length=120 --ignore=E501,W503 .

      - name: Run tests
        run: |
          cd todo-list
          python -m pytest test_app.py -v

  sbom-analysis:  # ← ДОЛЖЕН БЫТЬ НА ТОМ ЖЕ УРОВНЕ, ЧТО И quality-gate
    name: SBOM Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          input: 'todo-list/requirements.txt'


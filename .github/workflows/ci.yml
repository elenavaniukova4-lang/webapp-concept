name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Quality Gate Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug: Show directory structure
        run: |
          ls -la
          echo "----"
          find . -type d -name "todo-list" | head -5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # Попробуем оба варианта — сначала без webapp-concept
          if [ -d "todo-list" ]; then
            cd todo-list
          elif [ -d "webapp-concept/todo-list" ]; then
            cd webapp-concept/todo-list
          else
            echo "❌ ERROR: todo-list folder not found!"
            ls -R
            exit 1
          fi
          pip install -r requirements.txt flake8

      - name: Check Python syntax
        run: |
          if [ -f "app.py" ]; then
            python -m py_compile app.py
          else
            echo "❌ app.py not found in current directory"
            exit 1
          fi

      - name: Run linter (flake8)
        run: |
          flake8 --max-line-length=120 --ignore=E501,W503 .

